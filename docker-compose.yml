name: Pre-orden System #name of the project
services:
  # RabbitMQ Service
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: preorder_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # PostgresSQL Service
  postgres:
    image: postgres:latest
    container_name: preordersystem_db
    restart: always
    environment:
      POSTGRES_USER: pos_admin
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: pos_db
    ports:
      - "5431:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos_admin -d pos_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Express API Service
  express-api:
    build:
      context: .
    container_name: preordersystem_api
    restart: always
    ports:
      - "3000:3000" # Expose Express on port 3000
      - "5555:5555" # Expose Prisma Studio on port 5555
    depends_on:
      postgres:
        condition: service_healthy # Wait until Postgres accepts connections
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: "postgresql://pos_admin:mysecretpassword@postgres:5432/pos_db?schema=public" # Prisma connection string
      JWT_SECRET: "dev-only-secret-change-me"
      JWT_EXPIRES_IN: "8h"
      RABBITMQ_URL: amqp://preordersystem:posrabbitmq@rabbitmq:5672
    volumes:
      - .:/app # Mount the project directory inside the container
      - node_modules:/app/node_modules # Named volume instead of an anonymous one
    command: sh -c "npm ci && npx prisma generate && npx prisma migrate deploy && node --watch src/server.js"

  worker:
    build: .
    container_name: preorder_worker
    restart: unless-stopped
    command: node src/worker/paymentWorker.js
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pos_admin:mysecretpassword@postgres:5432/pos_db?schema=public
      RABBITMQ_URL: amqp://preordersystem:posrabbitmq@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  node_modules:
  rabbitmq_data:
